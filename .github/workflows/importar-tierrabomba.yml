name: Importar Tierra Bomba
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio de destino
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar repositorio de origen
        run: git clone --depth 1 https://github.com/anasoficasca-code/tierrabomba.git /tmp/tierrabomba-original
      - name: Copiar y verificar archivos sin alterar el origen
        shell: bash
        run: |
          rsync -a --exclude='.git' /tmp/tierrabomba-original/ ./
          for p in index.html assets/data/especies.json assets/modelo/tierrabomba_revit.glb assets/texturas/tierrabomba_satelite.jpg; do
            test -f "$p" || exit 1
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Copiar Tierra Bomba completo desde repositorio original'
          git push origin HEAD:main
